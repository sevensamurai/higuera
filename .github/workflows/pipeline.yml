# CI on every pull request and push; deploy to Firebase (Google Cloud) when main is green.
#
# Deploy auth is keyless: GitHub's OIDC token is exchanged for short-lived Google credentials through
# Workload Identity Federation, so no service-account key is stored in GitHub. One-time setup:
# scripts/setup-github-deploy.sh, then set the repository variables listed under `deploy` below.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the previous run; runs on main always finish.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6 # the Firestore emulator is a Java app
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:rules

  e2e:
    name: Browser walk-through (both languages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_SHOTS: ${{ github.workspace }}/e2e-shots
      # Screenshots of every step in light, dark and Spanish: handy for reviewing UI changes in a PR.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy to Firebase
    needs: [check, rules, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.FIREBASE_PROJECT_ID }}.web.app
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token for Workload Identity Federation
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Repository (or `production` environment) variables. None are secrets: the Firebase web config
    # ships to every browser anyway, and access is enforced by firestore.rules.
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Check deploy configuration
        run: |
          missing=0
          for v in FIREBASE_PROJECT_ID VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_APP_ID \
                   GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set (see README → Deploying)"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      # Site + Firestore rules + indexes. Rules ship with the code that relies on them.
      - run: npx firebase deploy --only hosting,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive
